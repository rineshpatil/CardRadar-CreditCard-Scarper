  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is CardRadar free?","acceptedAnswer":{"@type":"Answer","text":"Yes. The catalog, filters, card finder and 2-card compare are free. PRO (₹99/month or ₹999/year) adds unlimited CardRadar AI and 4-card compare."}},{"@type":"Question","name":"Where does the card data come from?","acceptedAnswer":{"@type":"Answer","text":"From each bank's own product page. A weekly check compares our data with that page and keeps a quote from the source. Changes are reviewed before they go live."}},{"@type":"Question","name":"What does Unverified mean?","acceptedAnswer":{"@type":"Answer","text":"We have not yet matched this card's details against the bank's page. Treat them as a starting point and confirm with the bank."}},{"@type":"Question","name":"Do you earn money when I apply?","acceptedAnswer":{"@type":"Answer","text":"No. There are no affiliate links, and applications happen on the bank's own site."}},{"@type":"Question","name":"Do you store my income or quiz answers?","acceptedAnswer":{"@type":"Answer","text":"No. The card finder runs in your browser and your answers are not sent anywhere."}},{"@type":"Question","name":"What does PRO include?","acceptedAnswer":{"@type":"Answer","text":"Unlimited CardRadar AI answers and comparing up to 4 cards side by side. Free accounts get 3 AI answers a day."}},{"@type":"Question","name":"Is this financial advice?","acceptedAnswer":{"@type":"Answer","text":"No. CardRadar is not a bank and this is not financial advice. Confirm details on the bank's website before you apply."}}]}</script>
